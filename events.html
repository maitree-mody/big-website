<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Events · Barnard Investment Group</title>
  <meta name="description" content="Barnard Investment Group (BIG) is Barnard College's first investment club, dedicated to empowering women to pursue careers in finance." />
  <meta property="og:title" content="Events · Barnard Investment Group" />
  <meta property="og:description" content="Barnard Investment Group (BIG) is Barnard College's first investment club, dedicated to empowering women to pursue careers in finance." />
  <meta property="og:image" content="assets/campus/barnard-hall-day.jpg" />
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="events">
  <div id="site-header"></div>
  <main>
    <section class="banner" data-bg="assets/campus/milstein.jpg">
      <div class="wrap">
        <p class="caps">Events</p>
        <h1>Events &amp; Programming</h1>
        <p class="lede">Speaker events, site visits, and workshops hosted by Barnard Investment Group. Select an event for details, a recap, and photographs.</p>
      </div>
    </section>
    <section class="section">
      <div class="wrap">
        <div class="section-head"><div><p class="caps">Calendar</p><h2 class="section-title">Upcoming Events</h2></div><a class="more" data-link="instagram" target="_blank" rel="noopener">Instagram →</a></div>
        <div id="upcoming"></div>
      </div>
    </section>
    <section class="section section--paper">
      <div class="wrap">
        <div class="section-head"><div><p class="caps">Archive</p><h2 class="section-title">Past Events</h2></div><div class="filters" id="filters">
            <button class="is-active" data-filter="all">All</button>
            <button data-filter="speaker">Speakers</button>
            <button data-filter="site-visit">Site Visits</button>
            <button data-filter="workshop">Workshops</button>
            <button data-filter="photos">With Photos</button>
          </div></div>
        <div id="archive"></div>
        <button class="btn btn--line show-more" id="more">Show earlier semesters</button>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
