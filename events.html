<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Events · Barnard Investment Group</title>
  <meta name="description" content="Barnard Investment Group (BIG) is Barnard College's first investment club, empowering women to pursue careers in finance." />
  <meta property="og:title" content="Events · Barnard Investment Group" />
  <meta property="og:description" content="Barnard Investment Group (BIG) is Barnard College's first investment club, empowering women to pursue careers in finance." />
  <meta property="og:image" content="assets/campus/barnard-hall-dusk.jpg" />
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,600;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="events">
  <div id="site-header"></div>
  <main>
    <section class="banner" data-bg="assets/campus/milstein.jpg">
      <div class="wrap">
        <p class="caps">Events</p>
        <h1>Speakers, site visits &amp; <em>recaps.</em></h1>
        <p class="lede">Click any event for the details, a write-up, and photos from the day.</p>
      </div>
    </section>
    <section class="section" style="padding-bottom:48px">
      <div class="wrap">
        <div class="section-head" style="margin-bottom:24px"><div><p class="caps">Upcoming</p><h2 class="section-title">On the calendar.</h2></div>
          <a class="more" data-link="instagram" target="_blank" rel="noopener">Follow on Instagram →</a></div>
        <div id="upcoming"></div>
      </div>
    </section>
    <section class="section section--paper" style="padding-top:64px">
      <div class="wrap">
        <div class="section-head" style="margin-bottom:0">
          <div><p class="caps">Archive</p><h2 class="section-title">Past events.</h2></div>
          <div class="filters" id="filters">
            <button class="is-active" data-filter="all">All</button>
            <button data-filter="speaker">Speakers</button>
            <button data-filter="site-visit">Site visits</button>
            <button data-filter="workshop">Workshops</button>
            <button data-filter="photos">With photos</button>
          </div>
        </div>
        <div id="archive"></div>
        <button class="btn btn--line show-more" id="more">Show older semesters</button>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
